<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時更新 RWD 資料庫網頁</title>
    <!-- 引入 Tailwind CSS 進行 RWD 排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-start p-4 sm:p-6 md:p-8">

    <div class="w-full max-w-2xl bg-white rounded-xl shadow-md overflow-hidden p-6 sm:p-8">
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-4 text-center">即時 RWD 資料庫留言板</h1>
        
        <!-- 輸入表單 -->
        <form id="msgForm" class="flex flex-col sm:flex-row gap-3 mb-6">
            <input 
                type="text" 
                id="msgInput" 
                placeholder="輸入一些即時訊息..." 
                required
                class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <button 
                type="submit" 
                class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2 rounded-lg transition-colors cursor-pointer">
                送出
            </button>
        </form>

        <!-- 資料顯示列表 (即時更新) -->
        <div>
            <h2 class="text-lg font-semibold text-slate-700 mb-3">即時資料列表：</h2>
            <ul id="msgList" class="space-y-3 max-h-96 overflow-y-auto pr-1">
                <!-- 動態載入資料 -->
            </ul>
        </div>
    </div>

    <!-- 引入 Socket.io 用戶端腳本 -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const msgForm = document.getElementById('msgForm');
        const msgInput = document.getElementById('msgInput');
        const msgList = document.getElementById('msgList');

        // 1. 頁面載入時透過 API 取得歷史資料
        async function fetchHistory() {
            try {
                const res = await fetch('/api/messages');
                const data = await res.json();
                msgList.innerHTML = '';
                data.forEach(item => appendMessage(item));
            } catch (err) {
                console.error('取得歷史資料失敗', err);
            }
        }

        // 2. 將單筆資料渲染到畫面上
        function appendMessage(item) {
            const li = document.createElement('li');
            li.className = "bg-slate-50 border border-slate-200 p-4 rounded-lg flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1 shadow-sm transition-all";
            
            const contentSpan = document.createElement('span');
            contentSpan.className = "text-slate-800 break-all";
            contentSpan.textContent = item.content;

            const timeSpan = document.createElement('span');
            timeSpan.className = "text-xs text-slate-400";
            timeSpan.textContent = new Date(item.created_at).toLocaleString();

            li.appendChild(contentSpan);
            li.appendChild(timeSpan);
            
            // 新資料插入在最上方
            msgList.prepend(li);
        }

        // 3. 表單送出事件
        msgForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = msgInput.value.trim();
            if (text) {
                // 發送事件至後端
                socket.emit('new_message', { content: text });
                msgInput.value = '';
            }
        });

        // 4. 監聽後端的即時更新廣播
        socket.on('update_message', (item) => {
            appendMessage(item);
        });

        // 初始化執行
        fetchHistory();
    </script>
</body>
</html>
